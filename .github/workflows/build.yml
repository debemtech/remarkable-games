name: Build

# Only pushes and tags, no pull requests: the runner is our own machine and
# must not run code from forks.
on:
  push:
    branches: ['**']
    tags: ['*']

env:
  GAMES: chess sudoku mahjong blackjack solitaire crossword

# Runs on our own runner (bix), which has the tools installed:
#   apt install qt6-base-dev-tools g++-aarch64-linux-gnu stockfish
jobs:
  test:
    runs-on: [self-hosted, bix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          CHESS_STOCKFISH=/usr/games/stockfish go test -race ./...

  build:
    needs: test
    runs-on: [self-hosted, bix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: stockfish-rmpp-${{ hashFiles('games/chess/stockfish.sh') }}
      - name: Build
        run: |
          for game in $GAMES; do
            ./build.sh "$game" rmpp
            tar -czf "build/$game-rmpp.tar.gz" -C build "$game-rmpp"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: games-rmpp
          path: build/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: [self-hosted, bix]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: games-rmpp
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.tar.gz'
