name: Build

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:

env:
  GAMES: chess sudoku mahjong blackjack solitaire crossword

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          CHESS_STOCKFISH=/usr/games/stockfish go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev-tools g++-aarch64-linux-gnu
      - uses: actions/cache@v6
        with:
          path: build/cache
          key: stockfish-rmpp-${{ hashFiles('games/chess/stockfish.sh') }}
      - name: Build
        run: |
          for game in $GAMES; do
            ./build.sh "$game" rmpp
            tar -czf "build/$game-rmpp.tar.gz" -C build "$game-rmpp"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: games-rmpp
          path: build/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: games-rmpp
      - uses: softprops/action-gh-release@v3
        with:
          files: '*.tar.gz'
